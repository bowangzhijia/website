# 每天早上自动抓财经热点，生成当天的「今日热点速览」并发上线。
#
# 两个关键设计：
#
#   1. 抓取、提交、构建、部署全都放在这一个 job 里。
#      因为用 GITHUB_TOKEN 推上去的提交**不会**再触发别的 workflow
#      （GitHub 防止无限递归）。如果只提交不构建，内容就上不了线。
#
#   2. 生成脚本遇到「当天已经有文章」会直接跳过，绝不覆盖你自己写的东西。
#      所以你要是某天自己写了复盘，这天的热点速览就不会生成。
#
# 想立刻试一次：到 Actions 页面选「每日热点速览」→ Run workflow。
# 想改抓取范围或关键词：改 scripts/hot-news.mjs。

name: 每日热点速览

on:
  schedule:
    # 每天 07:10（北京时间）。GitHub 的 cron 用 UTC，
    # 且高峰期可能延迟几分钟到十几分钟，这是正常的。
    - cron: '10 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot-news
  cancel-in-progress: false

jobs:
  hot-news:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 抓热点并生成今天的文章
        run: node scripts/hot-news.mjs

      - name: 提交
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "今天没有新内容（可能已有文章），结束"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "热点速览：$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: 构建网站
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: 部署到 Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name bowangzhijia
