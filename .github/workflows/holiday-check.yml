# 检查休市日历是否需要补年份。缺了就开 Issue 提醒（GitHub 会发邮件）。
#
# 为什么单独一个 workflow：它不是每日任务，一年只需要动一两次，
# 放在 etf-share.yml 里会每天白跑。
#
# 时间点：每年 11 月和 12 月各跑一次，都在 15 号。
#
# 国务院办公厅固定 11 月初发布次年安排，所以 11 月 15 号最容易发现问题。
# 之所以加 12 月那一次：万一 11 月赶上 Actions 故障或当天没跑成，
# 一年就漏过去了。第二次绝大多数时候是"齐全"直接通过，成本为零。

name: 休市日历检查

on:
  schedule:
    # 北京时间 11 月 15 日、12 月 15 日 10:00
    - cron: '0 2 15 11,12 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查并提醒
        run: node scripts/check-holidays.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
