# 每天抓马斯克 / 特朗普 / 奥特曼 的新推文，生成「大佬发言」并发上线。
#
# 和「每日热点速览」是同一套结构：抓取、提交、构建、部署放在一个 job 里。
# 因为用 GITHUB_TOKEN 推上去的提交不会再触发别的 workflow，
# 所以要自己把构建和部署也做掉。
#
# 数据源是 X 的 syndication 接口，免费、不需要任何密钥。
# 它有限流（约 30 次 / 15 分钟），这里一次只请求 3 次，离上限很远。
#
# 想立刻试一次：Actions 页面选「大佬发言」→ Run workflow。
# 想加人 / 改条数：改 scripts/x-quotes.mjs 顶部的 PEOPLE 和 MAX_PER_PERSON。

name: 大佬发言

on:
  schedule:
    # 每天 08:40（北京时间）。GitHub 的 cron 用 UTC，高峰期可能延迟十几分钟。
    # 比 07:10 的热点速览晚一点，避免两个任务同时抢着提交。
    - cron: '40 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x-quotes
  cancel-in-progress: false

jobs:
  x-quotes:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 抓推文并生成今天的文章
        run: node scripts/x-quotes.mjs

      - name: 提交
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "今天没有新的发言（或文章已存在），结束"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "大佬发言：$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: 构建网站
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: 部署到 Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name bowangzhijia
