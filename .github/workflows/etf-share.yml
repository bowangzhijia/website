# 每交易日生成「ETF 份额异动」，抓不到就等下一个时段重试。
#
# 为什么要排三个时段：交易所接口对境外 IP 是抽签——同一个脚本，
# 有的出口 IP 全通，有的上交所 403、深交所超时。单靠一次跑，失败率不低。
# 脚本会检查当天的文章是否已生成，有就跳过，所以多排几次不浪费请求。
#
# 抓取、提交、构建、部署必须放在同一个 job：
# 用 GITHUB_TOKEN 推上去的提交不会再触发别的 workflow（GitHub 防止无限递归），
# 只提交不构建，内容就上不了线。

name: ETF 份额异动

on:
  schedule:
    # 只留四次。理由：
    #
    # 1. 深交所官方说明「T 日晚间更新的 T 日规模仅供参考，以 T+1 日早间为准」，
    #    所以真正可信的是次日上午那次，晚间只能是"先看一眼"。
    # 2. 上交所实测 18~20 点之间发布，时间不固定（11-24 是 22:40 才出），
    #    19:00 去抓大概率还是 0 条，纯浪费。
    # 3. GitHub Actions 的 cron 延迟很大（实测 20:30 的排程跑到凌晨 2:49），
    #    排得越密越容易挤在一起，反而应该少而准。
    #
    # 20:30（UTC 12:30）当晚主时段，多数日子这时候已经齐了
    - cron: '30 12 * * 1-5'
    # 23:00（UTC 15:00）发布晚时补一次，距上一条 2.5 小时，间隔合理
    - cron: '0 15 * * 1-5'
    # 次日 09:10（UTC 01:10）官方口径的「T+1 早间」，最重要的一次
    - cron: '10 1 * * 1-5'
    # 次日 10:10（UTC 02:10）最后兜底
    - cron: '10 2 * * 1-5'
  workflow_dispatch:
  # 允许外部定时器触发（cron-job.org 之类）。
  # GitHub 自己的 schedule 延迟能到几小时，靠它做"晚上轮询"没意义，
  # 所以真正的轮询交给外部，GitHub 只负责执行抓取。
  # 触发时 github.event.schedule 为空，会走下面的 --refresh 分支。
  repository_dispatch:
    types: [etf-share]

permissions:
  contents: write

concurrency:
  group: etf-share
  cancel-in-progress: false

jobs:
  etf-share:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 抓份额并生成文章
        run: |
          case "${{ github.event.schedule }}" in
            # 20:30 是当晚主时段，走正常模式（抓不到就退出，等后面几次）
            "30 12 * * 1-5")
              echo "晚间首跑：正常抓取并出文章"
              node scripts/etf-share.mjs ;;
            *)
              echo "补抓/复核：重抓一遍，有修正就覆盖"
              node scripts/etf-share.mjs --refresh ;;
          esac

      - name: 提交
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有新内容（文章已存在或接口全挂），结束"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ETF份额：$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: 构建网站
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: 部署到 Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name bowangzhijia
