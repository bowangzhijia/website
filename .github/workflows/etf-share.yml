# 每交易日生成「ETF 份额异动」，抓不到就等下一个时段重试。
#
# 为什么要排三个时段：交易所接口对境外 IP 是抽签——同一个脚本，
# 有的出口 IP 全通，有的上交所 403、深交所超时。单靠一次跑，失败率不低。
# 脚本会检查当天的文章是否已生成，有就跳过，所以多排几次不浪费请求。
#
# 抓取、提交、构建、部署必须放在同一个 job：
# 用 GITHUB_TOKEN 推上去的提交不会再触发别的 workflow（GitHub 防止无限递归），
# 只提交不构建，内容就上不了线。

name: ETF 份额异动

on:
  schedule:
    # 北京时间 19:00（UTC 11:00）。上交所通常 18~20 点发布，这是最早的一次尝试，
    # 抢得早就当天更早看到；抢不到也不写盘，等后面几个时段。
    - cron: '0 11 * * 1-5'
    # 20:30（UTC 12:30）。主时段，多数日子这时候数据已经齐了。
    - cron: '30 12 * * 1-5'
    # 23:00 / 23:59（UTC 15:00 / 15:59）。有些日子交易所发布晚
    # （实测出现过 22 点还没出、22:40 才出），晚上多补两次。
    - cron: '0 15 * * 1-5'
    - cron: '59 15 * * 1-5'
    # 次日 07:00 / 08:00 / 09:10 / 09:40 / 10:10 复核。
    # 深交所说过「T 日晚间规模以 T+1 早间为准」，所以第二天再抓几遍核对，
    # 真有修正就覆盖快照和看板数据（文章不重写，避免覆盖手写内容）。
    - cron: '0 23 * * 1-5'
    - cron: '0 0 * * 1-5'
    - cron: '10 1 * * 1-5'
    - cron: '40 1 * * 1-5'
    - cron: '10 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-share
  cancel-in-progress: false

jobs:
  etf-share:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 抓份额并生成文章
        run: |
          case "${{ github.event.schedule }}" in
            # 19:00 和 20:30 是当晚的头两次，数据可能刚发布，走正常模式（抓不到就退出）
            "0 11 * * 1-5"|"30 12 * * 1-5")
              echo "晚间首跑：正常抓取并出文章"
              node scripts/etf-share.mjs ;;
            *)
              echo "补抓/复核：重抓一遍，有修正就覆盖"
              node scripts/etf-share.mjs --refresh ;;
          esac

      - name: 提交
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有新内容（文章已存在或接口全挂），结束"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ETF份额：$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: 构建网站
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: 部署到 Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name bowangzhijia
