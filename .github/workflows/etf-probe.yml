# 一次性验证：GitHub Actions 的 IP 能不能访问交易所 ETF 份额接口。
#
# 本地已跑通，这里只确认海外 IP 可达。推这个文件本身会触发一次。
# 结果写到 etf-probe.txt 并提交回仓库。
# 读完后本文件连同 scripts/etf-probe.mjs 一起删掉。

name: ETF 份额接口可达性验证

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/etf-probe.yml'
      - 'scripts/etf-probe.mjs'

permissions:
  contents: write

concurrency:
  group: etf-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 取出口 IP
        run: echo "PROBE_IP=$(curl -s --max-time 10 https://api.ipify.org)" >> "$GITHUB_ENV"

      - name: 探测（node fetch）
        run: node scripts/etf-probe.mjs

      # node 的 fetch 和 curl 走不同的 TLS/HTTP2 实现。
      # 两边结果不一样，说明是客户端问题；都一样失败，才是 IP 被拦。
      - name: 探测（curl 对照）
        continue-on-error: true
        run: |
          {
            echo "=== curl 对照 ==="
            for d in 2026-11-20 2026-11-19; do
              echo "--- SSE $d"
              curl -sS --http1.1 --max-time 30 -H 'User-Agent: Mozilla/5.0' \
                -H 'Referer: https://www.sse.com.cn/' \
                -w '\n[status=%{http_code} time=%{time_total}]\n' \
                "https://query.sse.com.cn/commonQuery.do?sqlId=COMMON_SSE_ZQPZ_ETFZL_XXPL_ETFGM_SEARCH_L&STAT_DATE=$d&pageHelp.pageSize=3&pageHelp.pageNo=1&pageHelp.beginPage=1&pageHelp.cacheSize=1&pageHelp.endPage=1" | head -c 600
              echo
              sleep 3
            done
            echo "--- SZSE"
            curl -sS --http1.1 --max-time 30 -H 'User-Agent: Mozilla/5.0' \
              -H 'Referer: https://www.szse.cn/' \
              -w '\n[status=%{http_code} time=%{time_total}]\n' \
              'https://www.szse.cn/api/report/ShowReport/data?SHOWTYPE=JSON&CATALOGID=1945&TABKEY=tab1&PAGENO=1&random=0.3' | head -c 600
            echo
          } > etf-probe-curl.txt 2>&1

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-probe.txt etf-probe-curl.txt
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有产生结果文件"
            exit 0
          fi
          git commit -m "ETF 份额接口可达性验证结果 [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
