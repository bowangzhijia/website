# 一次性验证：GitHub Actions 的 IP 能不能访问交易所 ETF 份额接口。
#
# 本地已跑通，这里只确认海外 IP 可达。推这个文件本身会触发一次。
# 结果写到 etf-probe.txt 并提交回仓库。
# 读完后本文件连同 scripts/etf-probe.mjs 一起删掉。

name: ETF 份额接口可达性验证

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/etf-probe.yml'
      - 'scripts/etf-probe.mjs'

permissions:
  contents: write

concurrency:
  group: etf-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 取出口 IP
        run: echo "PROBE_IP=$(curl -s --max-time 10 https://api.ipify.org)" >> "$GITHUB_ENV"

      - name: 探测
        run: node scripts/etf-probe.mjs

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-probe.txt
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有产生结果文件"
            exit 0
          fi
          git commit -m "ETF 份额接口可达性验证结果 [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
